<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:
    radial-gradient(circle at top,#47005e,#14001d 50%,#050008);
    color:white;
}

h1{
    font-size:4rem;
    text-align:center;
    margin-bottom:20px;
    text-shadow:0 0 20px #ff5ca8;
}

p{
    margin-bottom:40px;
}

button{
    padding:16px 34px;
    border:none;
    border-radius:50px;
    background:#ff4f9a;
    color:white;
    cursor:pointer;
    font-size:1rem;
    box-shadow:0 0 20px #ff4f9a;
}

.heart{
    position:absolute;
    color:#ff5ca8;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-120vh);
    }
}

</style>
</head>

<body>

<h1>Hi Beautiful 🌸</h1>

<p>I built something for you...</p>

<button onclick="location.href='loading.html'">
Open ❤️
</button>

<script>

for(let i=0;i<50;i++){

    const heart=document.createElement('div');

    heart.classList.add('heart');

    heart.innerHTML='❤';

    heart.style.left=Math.random()*100+'vw';

    heart.style.fontSize=
    (10+Math.random()*30)+'px';

    heart.style.animationDuration=
    (4+Math.random()*5)+'s';

    document.body.appendChild(heart);
}

</script>

</body>
</html>
