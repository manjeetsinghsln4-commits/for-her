<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery ❤️</title>

<style>

body{
    margin:0;
    background:#090010;
    padding:40px;
    font-family:Arial;
    color:white;
}

.gallery{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

img{
    width:100%;
    border-radius:20px;
}

button{
    margin-top:40px;
    padding:16px 30px;
    border:none;
    border-radius:40px;
    background:#ff4f9a;
    color:white;
    cursor:pointer;
}

</style>
</head>

<body>

<h1>Our Cute Gallery 📸</h1>

<div class="gallery">

<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">

</div>

<button onclick="location.href='video.html'">
Watch Something ❤️
</button>

</body>
</html>
